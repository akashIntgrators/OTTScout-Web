name: Publish OTTScout website

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ottscout-catalog-pilot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned browser dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse the last published catalogue without API imports
        shell: bash
        run: |
          python scripts/fetch_public_catalogue.py
          python - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          raw = Path('data/catalog.json').read_bytes()
          catalog = json.loads(raw)
          if not isinstance(catalog, dict) or type(catalog.get('schemaVersion')) is not int or catalog['schemaVersion'] != 1:
              raise SystemExit('Published catalogue must have schemaVersion 1')
          if catalog.get('mode') != 'live':
              raise SystemExit('Published catalogue must be live')
          if not isinstance(catalog.get('titles'), list) or not catalog['titles']:
              raise SystemExit('Published catalogue must contain titles')
          Path(os.environ['RUNNER_TEMP'], 'ottscout-published-catalogue.sha256').write_text(hashlib.sha256(raw).hexdigest())
          print(f'Reusing {len(catalog["titles"])} published titles; source timestamps are unchanged.')
          PYCODE
      - name: Check browser JavaScript
        run: node --check app.js
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Build website with the published snapshot
        run: python scripts/build_site.py
      - name: Preserve provider data and apply only verified official listings
        shell: bash
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, shutil, time
          from pathlib import Path
          from scripts.official_listings import apply_official_listings
          from scripts.official_registry import load_records
          source = Path('data/catalog.json')
          target = Path('.site/data/catalog.json')
          expected = Path(os.environ['RUNNER_TEMP'], 'ottscout-published-catalogue.sha256').read_text()
          if hashlib.sha256(source.read_bytes()).hexdigest() != expected:
              raise SystemExit('Source catalogue changed during website checks')
          catalog = json.loads(source.read_text())
          registry = Path('data/official-listings.json')
          if registry.exists() or Path('data/official-discovered.json').exists() or catalog.get('officialListingOverlay') or catalog.get('officialListingAliases'):
              staged = json.loads(target.read_text())
              evaluated = staged.get('officialListingOverlay', {}).get('evaluatedAt')
              if type(evaluated) is not int or abs(time.time() - evaluated) > 600:
                  raise SystemExit('Missing or stale official-listing build evaluation')
              records = load_records(Path('.'), catalog, now=evaluated)
              result, summary = apply_official_listings(catalog, records, evaluated)
              # Recompute the one allowed transformation from the unchanged
              # downloaded snapshot. Neither API imports nor unrelated edits
              # from the general builder can enter the public catalogue here.
              target.write_text(json.dumps(result, ensure_ascii=False), encoding='utf-8')
              print(f'Provider snapshot retained; {summary["fallback"]} official fallbacks applied. No provider or TMDB imports ran.')
          else:
              shutil.copyfile(source, target)
              if hashlib.sha256(target.read_bytes()).hexdigest() != expected:
                  raise SystemExit('Staged catalogue differs from the published snapshot')
              print('Published catalogue preserved byte-for-byte; no provider or TMDB imports ran.')
          PYCODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages website
        id: pages_upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site
      - name: Wait for the uploaded Pages artifact to be visible
        id: pages_ready
        if: steps.pages_upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/wait_for_pages_artifact.py
      - name: Deploy Pages website
        id: deployment
        if: steps.pages_ready.outcome == 'success'
        uses: actions/deploy-pages@v4
